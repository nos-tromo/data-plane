### Admin overlay — a loopback-only port for dashboard access over an SSH tunnel.
###
### NOT auto-loaded: it lives in docker/ and is layered only by `make up-admin`
### via explicit -f flags. Every binding is 127.0.0.1, so nothing becomes
### reachable from the network — the production boundary (no published ports)
### holds; the host itself is the only new client. Admins reach the dashboard
### through an SSH tunnel:
###
###   ssh -L 6333:localhost:6333 <host>
###
### then open http://localhost:6333/dashboard (Qdrant). `make up` drops the
### port again. Qdrant gRPC (6334) is deliberately omitted — the dashboard does
### not use it.

services:
  qdrant-cpu:
    ports:
      - "127.0.0.1:6333:6333"

  qdrant-cuda:
    ports:
      - "127.0.0.1:6333:6333"
