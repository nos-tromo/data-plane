### data-plane compose — the stateful service for docint (Qdrant).
###
### What this project owns:
###   - The named volumes that hold all vector data
###   - The qdrant service that reads/writes that data
###   - admin-audit, which records direct database access, backups and
###     restores in the data-protection audit trail (README: Audit trail)
###
### What it does NOT own:
###   - data-net  (external; created via 'make network', shared with app backends)
###   - Application code or app-side state (docint/ keeps its own SQLite,
###     caches, logs, etc.)
###
### Blast-radius design:
###   `docker compose down -v` *here* will destroy vector data — that risk is
###   concentrated in this one project. The docint compose file declares none
###   of these volumes, so `down -v` over there is always safe. Backup +
###   restore runbooks live in backup/.

name: data-plane

##########################################################
# Shared logging — the local driver rotates and compresses
# the containers' stdout/stderr streams. Tail with
# `docker compose logs -f <svc>`.
##########################################################
x-logging: &default-logging
  driver: "local"
  options:
    max-size: "50m"
    max-file: "5"
    compress: "true"

##########################################################
# Shared hardening (deploy ADR 0001) — no privilege
# escalation, all capabilities dropped. Deliberately
# deferred for Qdrant: `user:` and `read_only:` — it
# manages its own on-disk state on external volumes whose
# existing ownership is image-managed, and this repo's CI
# is lint-only, so a UID change would land untested. The
# root-daemon exposure is instead compensated host-side
# (userns-remap; runbook in the deploy repo).
##########################################################
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

networks:
  data-net:
    external: true
    name: ${DATA_NET:-data-net}

services:
  ##########################################################
  # Qdrant  —  vector store for docint  (CPU profile)
  ##########################################################
  qdrant-cpu:
    <<: *hardened
    image: docker.io/qdrant/qdrant:v1.18.3@sha256:0bd98fa7977f1e75694779359ca4e212822e5a71334e28421182f72f209d5286
    logging: *default-logging
    # The API key is required: an empty value is not "no auth" — Qdrant then
    # answers every request that carries no key with 401, docint's included.
    # /readyz is exempt, so the healthcheck never needs it; the scripts that
    # talk to Qdrant read it from the container's own environment
    # (QDRANT__SERVICE__API_KEY).
    environment: &qdrant-env
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY must be set in .env (generate one with openssl rand -hex 32; docint's QDRANT_API_KEY takes the same value)}
      QDRANT__TELEMETRY_DISABLED: "true"
    expose: &qdrant-ports
      - "6333"   # http
      - "6334"   # grpc
    volumes: &qdrant-volumes
      - qdrant-snapshots:/qdrant/snapshots
      - qdrant-storage:/qdrant/storage
    networks:
      data-net:
        aliases:
          - qdrant
    # The image ships no curl/wget/python3, but bash with /dev/tcp is present
    # (verified on both variants), so the probe speaks HTTP/1.0 to /readyz over
    # bash's built-in socket redirection. $$ escapes compose interpolation.
    # start_period is generous: a minor-version bump migrates the storage
    # format on first boot, which can take a while on large datasets.
    healthcheck: &qdrant-healthcheck
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/localhost/6333; printf "GET /readyz HTTP/1.0\r\n\r\n" >&3; read -r _ code _ <&3; [ "$$code" = 200 ]'
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    profiles: ["cpu"]

  ##########################################################
  # Qdrant  —  vector store for docint  (CUDA profile)
  ##########################################################
  qdrant-cuda:
    <<: *hardened
    image: docker.io/qdrant/qdrant:v1.18.3-gpu-nvidia@sha256:aec0e543da5076119e209336e7f41fbda0afc5222c0202ef58f4c6088a6280f3
    logging: *default-logging
    environment:
      <<: *qdrant-env
      QDRANT__GPU__INDEXING: "1"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
      NVIDIA_VISIBLE_DEVICES: all
    expose: *qdrant-ports
    volumes: *qdrant-volumes
    networks:
      data-net:
        aliases:
          - qdrant
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # See note on the CPU profile re: the /dev/tcp healthcheck.
    healthcheck: *qdrant-healthcheck
    restart: unless-stopped
    profiles: ["cuda"]

  ##########################################################
  # admin-audit  —  the record of access that bypasses the apps
  ##########################################################
  # Qdrant keeps no access log, so the operator targets that open the store
  # directly (make qdrant-shell), back it up or restore it run through
  # scripts/audit-admin.sh, which records each one here with
  # `docker compose exec`: a chain of its own per record, written into this
  # container's log (README: Audit trail). The long-running process only
  # records its configuration and beats. Stdlib Python mounted read-only;
  # nothing is installed. No network, no volumes: it reads nothing and
  # writes only its stdout.
  admin-audit:
    <<: *hardened
    image: docker.io/library/python:3.12.16-alpine3.24@sha256:e6dae589c1c05976188fd3bd019afd091445fc533ed2ea29001beddc7368a9c8
    logging: *default-logging
    # The image's `nobody`.
    user: "65534:65534"
    read_only: true
    network_mode: none
    tmpfs:
      - /tmp:size=1m
    entrypoint: ["python", "/app/admin_audit.py"]
    command: ["serve"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      AUDIT_OUTPUT: container
      # The actions whose records need a stated purpose (CASE_REF / REASON).
      # Backups are `disclose`, restores `modify`; the shells always need
      # one. Set it empty in .env to require none: the default applies only
      # while the variable is unset.
      AUDIT_REQUIRE_PURPOSE: ${AUDIT_REQUIRE_PURPOSE-query,disclose}
    volumes:
      - ../audit:/app:ro
      - ../VERSION:/etc/data-plane/VERSION:ro
    healthcheck:
      test: ["CMD", "python", "/app/admin_audit.py", "check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

##########################################################
# Volumes — all persistent data-plane state lives here.
##########################################################
volumes:
  qdrant-snapshots:
    external: true
  qdrant-storage:
    external: true
