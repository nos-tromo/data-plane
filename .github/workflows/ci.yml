name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Pinned to an immutable commit SHA (v3.12): infra checks + make/common.mk
    # and bundle-lib drift-checks.
    uses: nos-tromo/.github/.github/workflows/infra-validation.yml@44032ac756bd7700ba19fc65e141a5c2f8992416 # v3.20
    with:
      compose-files: '-f docker/compose.yaml -f docker/compose.override.yaml -f docker/compose.admin.yaml'
      compose-profiles: '--profile cpu --profile cuda'
      dockerfiles-glob: 'docker/Dockerfile.*'
      shell-scripts-glob: 'scripts/*.sh'

  audit-tests:
    # admin-audit (audit/admin_audit.py) and the scripts that run it: stdlib
    # unittest, synthetic data, nothing installed. Once on the runner (with
    # bash, for scripts/audit-admin.sh and the store scripts), once in the
    # pinned python image as the container runs it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: unittest (runner python)
        run: python3 -m unittest discover -s audit/tests -t audit -v
      - name: unittest (pinned image, read-only, uid 65534, no network)
        run: |
          docker run --rm --read-only --tmpfs /tmp --user 65534:65534 --network none -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD/audit:/app:ro" \
            docker.io/library/python:3.12.16-alpine3.24@sha256:e6dae589c1c05976188fd3bd019afd091445fc533ed2ea29001beddc7368a9c8 \
            python -m unittest discover -s /app/tests -t /app
